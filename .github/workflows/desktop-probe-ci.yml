name: Desktop probe CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Format, build, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Record revision and toolchain
        run: |
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --manifest-path experiments/desktop-probe/Cargo.toml --check

      - name: Build
        run: cargo build --manifest-path experiments/desktop-probe/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path experiments/desktop-probe/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path experiments/desktop-probe/Cargo.toml
